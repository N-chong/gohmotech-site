map $http_upgrade $gohmotech_connection_upgrade {
    default upgrade;
    '' close;
}
map $http_cf_connecting_ip $gohmotech_client_ip {
    default $http_cf_connecting_ip;
    '' $remote_addr;
}
limit_req_zone $gohmotech_client_ip zone=gohmotech_auth_realip:10m rate=10r/m;

server {
    listen 127.0.0.1:8080 default_server;
    server_name _;
    return 444;
}

server {
    listen 127.0.0.1:8080;
    server_name gohmotech.site www.gohmotech.site;
    client_max_body_size 12m;
    server_tokens off;

    location = /static/manifest.webmanifest {
        alias /var/www/gohmotech-production/static/manifest.webmanifest;
        types {
            application/manifest+json webmanifest;
        }
        default_type application/manifest+json;
        add_header X-Content-Type-Options nosniff always;
        expires 1h;
    }

    location /static/ {
        alias /var/www/gohmotech-production/static/;
        autoindex off;
        add_header X-Content-Type-Options nosniff always;
        expires 1h;
    }

    # Staff-only ML weights upload. Other routes retain the server-wide 12 MB
    # limit. Nginx writes large request bodies to temporary storage instead of
    # retaining the complete checkpoint in RAM.
    location = /ml/api/models/upload/ {
        client_max_body_size 512m;
        client_body_timeout 1800s;
        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $gohmotech_client_ip;
        proxy_set_header X-Forwarded-For $gohmotech_client_ip;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $gohmotech_client_ip;
        proxy_set_header X-Forwarded-For $gohmotech_client_ip;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $gohmotech_connection_upgrade;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }

    location ~ ^/(accounts/|marketplace/(login|register)/) {
        limit_req zone=gohmotech_auth_realip burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8010;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $gohmotech_client_ip;
        proxy_set_header X-Forwarded-For $gohmotech_client_ip;
    }
}
