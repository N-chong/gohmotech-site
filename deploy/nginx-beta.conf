# Include from nginx's http context. Loopback origin for an HTTPS tunnel ONLY.
# A public port-80 deployment needs a separate TLS-terminating server block.
map $http_upgrade $gohmotech_connection_upgrade {
    default upgrade;
    '' close;
}
limit_req_zone $binary_remote_addr zone=gohmotech_auth:10m rate=10r/m;

server {
    listen 127.0.0.1:8080 default_server;
    server_name _;
    return 444;
}

server {
    listen 127.0.0.1:8080;
    server_name gohmotech.site www.gohmotech.site;
    client_max_body_size 12m;
    server_tokens off;

    # Static assets are copied here by collectstatic. No MEDIA_ROOT alias:
    # media, including seller verification documents, goes through Django.
    location /static/ {
        alias /var/www/gohmotech-beta/static/;
        autoindex off;
        add_header X-Content-Type-Options nosniff always;
        expires 1h;
    }

    # Staff-only ML weights upload. Other routes retain the server-wide 12 MB
    # limit. Nginx spools large request bodies to temporary storage.
    location = /ml/api/models/upload/ {
        client_max_body_size 512m;
        client_body_timeout 1800s;
        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
        proxy_buffering off;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # Tunnel origin is loopback; preserve HTTPS semantics at the edge and
    # configure its HTTP-to-HTTPS redirect before attaching public DNS.
    location / {
        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $gohmotech_connection_upgrade;
        proxy_read_timeout 300s;
        proxy_buffering off;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    location ~ ^/(accounts/|marketplace/(login|register)/) {
        # Initially shared for tunnel traffic unless a trusted edge IP header
        # is configured. Conservative aggregate protection for a small beta.
        limit_req zone=gohmotech_auth burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8010;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
}
