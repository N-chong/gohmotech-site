name: Build GoHMoTech Android APK

on:
  push:
    branches:
      - main
    paths:
      - 'goh-mo-tech-app/**'
      - '.github/workflows/build-apk.yml'

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build GoHMoTech Debug APK
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: goh-mo-tech-app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: goh-mo-tech-app/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Install dependencies
        run: npm ci

      - name: Build Ionic application
        run: npm run build

      - name: Synchronize Capacitor Android
        run: npx cap sync android

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: goh-mo-tech-app/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Prepare APK artifact
        run: |
          mkdir -p artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk artifacts/GoHMoTech-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: GoHMoTech-Debug-APK
          path: goh-mo-tech-app/artifacts/GoHMoTech-debug.apk
          if-no-files-found: error
          retention-days: 30
