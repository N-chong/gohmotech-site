{% load static %}<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#174f38"><title>{{ status_code }} | GoHMoTech</title><link rel="icon" href="{% static 'images/gohmotech-logo.png' %}"><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;background:#f6f5ef;color:#17231b;font:15px/1.6 system-ui,sans-serif}.card{width:min(100%,560px);padding:clamp(26px,7vw,48px);border:1px solid #dce3dc;border-radius:24px;background:#fff;box-shadow:0 22px 60px rgba(23,55,37,.12)}.code{color:#2f7d56;font-size:13px;font-weight:800;letter-spacing:.15em;text-transform:uppercase}h1{margin:10px 0;font-size:clamp(27px,7vw,39px);line-height:1.15}p{margin:0 0 24px;color:#68736c}a{display:inline-flex;min-height:46px;align-items:center;padding:0 17px;border-radius:12px;background:#174f38;color:#fff;text-decoration:none;font-weight:750}</style></head><body><main class="card"><div class="code">Error {{ status_code }}</div><h1>{{ error_title }}</h1><p>{{ error_message }}</p><a href="/">Return to GoHMoTech</a></main></body></html>
